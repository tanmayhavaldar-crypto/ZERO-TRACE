[package]
name = "drive_eraser"
version = "0.1.0"
edition = "2021"

[dependencies]
eraser_common = { path = "../eraser_common" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "1"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
serde_json = "1"